[package]
name = "browsers"
version = "0.1.0"
edition = "2021"

[dependencies]
# Réseau et JSON
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptographie et Données
aes-gcm = "0.10"
base64 = "0.21"
regex = "1"
chrono = "0.4"
zip = "0.6"
libloading = "0.8"

# Correction SQLite : On force la compilation intégrée
rusqlite = { version = "0.29.0", features = ["bundled"] }

# API Windows Officielle
[dependencies.windows]
version = "0.52"
features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_System_SystemServices"
]