[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "link-arg=/SUBSYSTEM:WINDOWS",
    "-C", "link-arg=/INCREMENTAL:NO",
    "-C", "link-arg=/OPT:REF",
    "-C", "link-arg=/OPT:ICF",
]

[target.x86_64-pc-windows-gnu]
rustflags = [
    "-C", "link-arg=-Wl,--subsystem,windows",
    "-C", "link-arg=-Wl,--gc-sections",
]
