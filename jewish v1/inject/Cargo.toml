[package]
name = "inject"
version = "1.0.0"
edition = "2021"

[dependencies]
obfstr = "0.4"
ntapi = "0.4"
serde_json = "1"

[target."cfg(windows)".dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
] }
winreg = "0.50"
